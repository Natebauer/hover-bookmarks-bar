<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hover Bookmarks Bar</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f1f23; --muted: #6b6b73; --hover: rgba(0,0,0,.06); --border: rgba(0,0,0,.1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #2a2a2e; --fg: #ececf0; --muted: #a0a0aa; --hover: rgba(255,255,255,.08); --border: rgba(255,255,255,.1); color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 260px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
    header img { width: 28px; height: 28px; }
    header b { display: block; font-size: 14px; }
    header span { color: var(--muted); font-size: 12px; }
    nav { padding: 4px; border-top: 1px solid var(--border); }
    button {
      all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border-radius: 6px; cursor: pointer;
    }
    button:hover, button:focus-visible { background: var(--hover); }
    svg { width: 16px; height: 16px; flex: 0 0 16px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <div><b>Hover Bookmarks Bar</b><span>Hover at the top of any page</span></div>
  </header>
  <nav>
    <button id="welcome" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      How to use
    </button>
    <button id="options" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Choose folder…
    </button>
    <button id="help" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
      Help &amp; support
    </button>
  </nav>
  <script src="popup.js"></script>
</body>
</html>
