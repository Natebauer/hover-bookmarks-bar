<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hover Bookmarks Bar options</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1f1f23; --muted: #6b6b73; --border: rgba(0,0,0,.12);
      --hover: rgba(0,0,0,.05); --accent: #2f6fdf; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #232327; --fg: #ececf0; --muted: #a0a0aa; --border: rgba(255,255,255,.12);
        --hover: rgba(255,255,255,.06); --accent: #7ea8ff; color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px 20px 20px; min-width: 360px; background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    .list { border: 1px solid var(--border); border-radius: 8px; padding: 4px; max-height: 380px; overflow-y: auto; }
    label {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    label:hover { background: var(--hover); }
    input { accent-color: var(--accent); margin: 0; flex: 0 0 auto; }
    .count { color: var(--muted); margin-left: auto; padding-left: 12px; }
    .default { font-weight: 600; }
    .sep { height: 1px; background: var(--border); margin: 4px 6px; }
    #status { min-height: 18px; margin-top: 8px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Folder shown in the bar</h1>
  <p>Most browsers use their bookmarks bar folder. In Vivaldi, pick the folder your Vivaldi bookmark bar shows.</p>
  <div class="list" id="list" role="radiogroup" aria-label="Bookmark folder"></div>
  <div id="status" role="status"></div>
  <script src="settings.js"></script>
  <script src="options.js"></script>
</body>
</html>
